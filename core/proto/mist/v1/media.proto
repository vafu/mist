syntax = "proto3";

package mist.v1;

// One media player's current state, including the host device.
message MediaState {
  string player_id = 1;
  string name = 2;
  PlaybackStatus status = 3;
  MediaMetadata metadata = 4;
  MediaCapabilities capabilities = 5;
  uint64 position_ms = 6;
  bool has_position = 7;
}

message MediaMetadata {
  string title = 1;
  string artist = 2;
  string album = 3;
  string art_url = 4;
  uint64 duration_ms = 5;
  bool has_duration = 6;
}

message MediaCapabilities {
  bool can_play = 1;
  bool can_pause = 2;
  bool can_go_next = 3;
  bool can_go_previous = 4;
}

enum PlaybackStatus {
  PLAYBACK_STATUS_STOPPED = 0;
  PLAYBACK_STATUS_PLAYING = 1;
  PLAYBACK_STATUS_PAUSED = 2;
}

// Complete snapshot of every player hosted by the sending device.
message MediaSnapshot {
  repeated MediaState players = 1;
}

// Transport command addressed to one player on the receiving device.
message MediaCommandRequest {
  string player_id = 1;
  MediaCommand command = 2;
}

enum MediaCommand {
  MEDIA_COMMAND_PLAY = 0;
  MEDIA_COMMAND_PAUSE = 1;
  MEDIA_COMMAND_PLAY_PAUSE = 2;
  MEDIA_COMMAND_STOP = 3;
  MEDIA_COMMAND_NEXT = 4;
  MEDIA_COMMAND_PREVIOUS = 5;
}
