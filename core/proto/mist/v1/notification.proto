syntax = "proto3";

package mist.v1;

// A platform notification transported between paired Mist devices.
message Notification {
  // Stable identifier assigned by the originating platform.
  string id = 1;
  string application = 2;
  string title = 3;
  string body = 4;
  int64 timestamp_ms = 5;
  bool silent = 6;
  NotificationKind kind = 7;
  // Binary payloads follow the control frame on the same stream, in this order.
  NotificationImage app_icon = 8;
  NotificationImage image = 9;
  repeated NotificationAction actions = 10;
}

// One actionable button, identified by a stable key.
message NotificationAction {
  string id = 1;
  string label = 2;
}

// The user activated an action on a notification this device sent.
message NotificationActionActivated {
  string notification_id = 1;
  string action_id = 2;
}

// The user is done with a notification this device sent: they dismissed it,
// or activating an action consumed it. The owner should clear its own copy.
message NotificationConsumed {
  string notification_id = 1;
}

// Metadata for one notification image; bytes follow the control frame.
message NotificationImage {
  string mime_type = 1;
  uint64 size = 2;
  // BLAKE3 content hash. Field name retained for wire compatibility.
  bytes sha256 = 3;
  // iroh-blobs ticket for the image. Content is pulled from the sender.
  string ticket = 4;
}

// Platform classification of a notification. Values are wire-stable.
enum NotificationKind {
  NOTIFICATION_KIND_UNSPECIFIED = 0;
  NOTIFICATION_KIND_MESSAGE = 1;
  NOTIFICATION_KIND_MEDIA = 2;
  NOTIFICATION_KIND_OTHER = 3;
}
