syntax = "proto3";

package mist.v1;

import "mist/v1/device.proto";

// Sent after pairing authorization and on every subsequent connection.
message SessionHello {
  uint32 protocol_version = 1;
  DeviceInfo device = 2;
  CapabilitySnapshot capabilities = 3;
  AddressSnapshot addresses = 4;
}

// Complete current reachability snapshot for one authenticated endpoint.
message AddressSnapshot {
  uint64 revision = 1;
  repeated TransportAddress addresses = 2;
}

message TransportAddress {
  oneof value {
    string relay_url = 1;
    string ip_socket = 2;
    string custom = 3;
  }
}

message CapabilitySnapshot {
  repeated Capability capabilities = 1;
}

// A named, independently versioned feature and its current directional state.
message Capability {
  string id = 1;
  uint32 protocol_version = 2;
  CapabilityState source_state = 3;
  CapabilityState sink_state = 4;
}

enum CapabilityState {
  CAPABILITY_STATE_UNSUPPORTED = 0;
  CAPABILITY_STATE_ENABLED = 1;
  CAPABILITY_STATE_DISABLED = 2;
  CAPABILITY_STATE_UNAVAILABLE = 3;
}

// Updates one feature after its permission, provider, or user policy changes.
message CapabilityChanged {
  Capability capability = 1;
}
