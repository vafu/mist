syntax = "proto3";

package mist.v1;

// User-visible information about a device. This data is exchanged only after
// the remote endpoint has been authorized.
message DeviceInfo {
  string display_name = 1;
  reserved 2;
  reserved "device_class";
  Platform platform = 3;
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_ANDROID = 1;
  PLATFORM_LINUX = 2;
  reserved 3, 4, 5;
  reserved "PLATFORM_IOS", "PLATFORM_MACOS", "PLATFORM_WINDOWS";
  PLATFORM_OTHER = 6;
}
