syntax = "proto3";

package mist.v1;

import "mist/v1/pairing.proto";
import "mist/v1/session.proto";
import "mist/v1/notification.proto";
import "mist/v1/clipboard.proto";
import "mist/v1/media.proto";

// One length-delimited message on Mist's control stream.
message ControlFrame {
  oneof body {
    PairingAuthenticate pairing_authenticate = 1;
    PairingAuthenticated pairing_authenticated = 2;
    PairingRejected pairing_rejected = 3;
    SessionHello session_hello = 4;
    CapabilityChanged capability_changed = 5;
    Notification notification = 6;
    AddressSnapshot address_snapshot = 7;
    ClipboardItem clipboard_item = 8;
    MediaSnapshot media_snapshot = 9;
    MediaCommandRequest media_command = 10;
  }
}
