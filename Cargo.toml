[workspace]
members = ["apps/cli", "core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91"
version = "0.1.0"

[workspace.dependencies]
base64 = "=0.23.1"
bytes = "=1.12.1"
getrandom = "=0.4.3"
iroh = { version = "=1.2.0", default-features = false, features = ["portmapper", "tls-ring", "unstable-custom-transports"] }
iroh-tickets = "=1.0.0"
prost = "=0.14.4"
qrcode = { version = "=0.14.1", default-features = false }
subtle = "=2.6.1"
thiserror = "=1.0.69"
tokio = { version = "=1.51.4", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
