[workspace]
members = ["apps/cli", "core", "core/app-contract"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91"
version = "0.1.0"

[workspace.dependencies]
base64 = "=0.23.1"
bytes = "=1.12.1"
getrandom = "=0.4.3"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
futures-util = "=0.3.31"
iroh = { version = "=1.2.0", default-features = false, features = ["portmapper", "tls-ring", "unstable-custom-transports"] }
iroh-blobs = { version = "=0.104.1", default-features = false, features = ["fs-store"] }
iroh-base = "=1.3.0"
iroh-tickets = "=1.0.0"
n0-future = "=0.3.2"
prost = "=0.14.4"
qrcode = { version = "=0.14.1", default-features = false }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
subtle = "=2.6.1"
tempfile = "=3.27.0"
thiserror = "=1.0.69"
wl-clipboard-rs = { version = "=0.9.5", features = ["native_lib"] }
tokio = { version = "=1.51.4", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
