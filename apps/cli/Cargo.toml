[package]
name = "mist-cli"
description = "Native command-line host for Mist"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "mist"
path = "src/main.rs"

[[bin]]
name = "mistd"
path = "src/bin/mistd.rs"

[lib]
name = "mist_linux"
path = "src/lib.rs"

[dependencies]
futures-util.workspace = true
iroh.workspace = true
mist-core = { path = "../../core" }
mist-app-contract = { path = "../../core/app-contract" }
qrcode.workspace = true
thiserror.workspace = true
tokio.workspace = true
wl-clipboard-rs.workspace = true
zbus.workspace = true

[lints]
workspace = true
