<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35302a"/>
      <stop offset="1" stop-color="#181716"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="280" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3e6c9"/>
      <stop offset="1" stop-color="#c0a675"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

  <g fill="none" stroke="url(#ink)" stroke-linecap="round" stroke-linejoin="round">
    <!-- cable: gentle anchors, tall towers, deep centre sag -->
    <path d="M120 706 C 178 640, 240 470, 300 330
             C 380 640, 460 690, 512 690
             C 564 690, 644 640, 724 330
             C 784 470, 846 640, 904 706" stroke-width="26"/>

    <!-- hangers -->
    <path d="M392 566 L392 692" stroke-width="13"/>
    <path d="M452 640 L452 692" stroke-width="13"/>
    <path d="M572 640 L572 692" stroke-width="13"/>
    <path d="M632 566 L632 692" stroke-width="13"/>

    <!-- towers -->
    <path d="M300 306 L300 800" stroke-width="40"/>
    <path d="M724 306 L724 800" stroke-width="40"/>
    <path d="M266 306 L334 306" stroke-width="28"/>
    <path d="M690 306 L758 306" stroke-width="28"/>

    <!-- deck -->
    <path d="M120 706 L904 706" stroke-width="38"/>

    <!-- approach ramps -->
    <path d="M120 706 L66 796" stroke-width="26"/>
    <path d="M904 706 L958 796" stroke-width="26"/>
  </g>
</svg>
